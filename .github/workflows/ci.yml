name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Test and build frontend
        working-directory: web
        run: npm run check
      - name: Verify committed frontend bundle
        run: |
          if [[ -n "$(git status --porcelain -- web/dist)" ]]; then
            git status --short -- web/dist
            echo 'web/dist is not synchronized with web/src. Run npm run build in web/ and commit the result.' >&2
            exit 1
          fi

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run manager tests
        shell: powershell
        run: .\tests\Test-Manager.ps1

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run manager tests
        shell: pwsh
        run: .\tests\Test-Manager.ps1

  linux:
    name: Linux scripts and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        run: |
          for file in linux/*.sh linux/runtime/*.sh tests/*.sh; do
            bash -n "$file"
          done
      - name: Run Linux integration tests
        run: bash tests/test-linux.sh
      - name: Check repository privacy
        run: bash tests/test-privacy.sh
